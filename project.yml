name: MacLink
options:
  bundleIdPrefix: com.sivanalluri
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MacLink:
    type: application
    platform: macOS
    sources:
      - path: MacLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sivanalluri.maclink
        PRODUCT_NAME: MacLink
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MacLink/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacLink/Resources/MacLink.entitlements
    scheme:
      testTargets:
        - MacLinkTests
  MacLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacLinkTests
    dependencies:
      - target: MacLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sivanalluri.maclink.tests
        GENERATE_INFOPLIST_FILE: true

