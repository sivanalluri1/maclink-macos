name: MacLink
options:
  bundleIdPrefix: com.sivanalluri
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: true
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MacLink:
    type: application
    platform: macOS
    sources:
      - path: MacLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sivanalluri.maclink
        PRODUCT_NAME: MacLink
        INFOPLIST_KEY_CFBundleDisplayName: MacLink
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MacLink connects securely to your paired Android phone on your local network.
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Siva Nalluri. All rights reserved.
    scheme:
      testTargets:
        - MacLinkTests
  MacLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacLinkTests
    dependencies:
      - target: MacLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sivanalluri.maclink.tests
        GENERATE_INFOPLIST_FILE: true

